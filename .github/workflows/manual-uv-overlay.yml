name: Manual UV overlay

on:
  push:
    branches:
      - manual-uv-overlay
    paths:
      - 'overlays/manual-uv/**'
      - '.github/workflows/manual-uv-overlay.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'overlays/manual-uv/**'
      - '.github/workflows/manual-uv-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Apply overlay and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout overlay branch
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout latest upstream
        uses: actions/checkout@v4
        with:
          repository: monovibe/s26u-m3q-temp-root
          ref: main
          path: src
          fetch-depth: 1

      - name: Record source identities
        shell: bash
        run: |
          set -euo pipefail
          echo "OVERLAY_SHA=$(git -C overlay rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'overlay=%s\nupstream=%s\n' \
            "$(git -C overlay rev-parse HEAD)" \
            "$(git -C src rev-parse HEAD)"

      - name: Fail closed if overlay no longer applies
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/overlay/overlays/manual-uv/carrier-handoff.patch"
          git -C src apply --recount --check "$PATCH"
          git -C src apply --recount "$PATCH"
          git -C src diff --check

          mapfile -t changed < <(git -C src diff --name-only)
          printf 'changed: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            'exploit/src/targets/m3q-BP4A.251205.006/pipe.c'

          grep -Fq 'm3q_start_gpu_uv_keeper' \
            src/exploit/src/targets/m3q-BP4A.251205.006/pipe.c
          grep -Fq 'm3q_gpu_uv_verify(gx, 0)' \
            src/exploit/src/targets/m3q-BP4A.251205.006/pipe.c
          grep -Fq 'M3Q_GPU_LEVEL_COUNT 20U' \
            src/exploit/src/targets/m3q-BP4A.251205.006/pipe.c

      - name: Make overlay APK install side-by-side
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('src/android/app/build.gradle')
          text = gradle.read_text()
          old = "applicationId 'dev.indevelopment.m3qroot.hardened'"
          new = "applicationId 'dev.indevelopment.m3qroot.hardened.manualuv'"
          if text.count(old) != 1:
              raise SystemExit('applicationId anchor drift')
          text = text.replace(old, new, 1)
          old = "versionName '0.5.6'"
          if text.count(old) == 1:
              text = text.replace(old, "versionName '0.5.6-manual-uv'", 1)
          gradle.write_text(text)

          strings = Path('src/android/app/src/main/res/values/strings.xml')
          text = strings.read_text()
          for old, new in [
              ('<string name="app_name">M3Q Root</string>',
               '<string name="app_name">M3Q Root Manual UV</string>'),
              ('<string name="app_title">M3Q Root</string>',
               '<string name="app_title">M3Q Root Manual UV</string>'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'string anchor drift: {old}')
              text = text.replace(old, new, 1)
          strings.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-37' \
            'build-tools;37.0.0' \
            'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build native payloads
        working-directory: src/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-native.sh test-safety-policy.sh gradlew
          ./build-native.sh

      - name: Upstream safety policy
        working-directory: src/android
        shell: bash
        run: |
          set -euo pipefail
          ./test-safety-policy.sh

      - name: Lint and assemble release
        working-directory: src/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease

      - name: Package proof bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp src/android/app/build/outputs/apk/release/app-release.apk \
            out/m3q-root-manual-uv.apk
          cp overlay/overlays/manual-uv/apply_gpu_uv.sh out/apply_gpu_uv.sh
          chmod +x out/apply_gpu_uv.sh
          printf '%s\n' "$UPSTREAM_SHA" > out/UPSTREAM_SHA.txt
          printf '%s\n' "$OVERLAY_SHA" > out/OVERLAY_SHA.txt
          sha256sum out/m3q-root-manual-uv.apk out/apply_gpu_uv.sh \
            > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Upload all-green artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3q-manual-uv-${{ env.UPSTREAM_SHA }}
          path: out/
          if-no-files-found: error
          retention-days: 14
